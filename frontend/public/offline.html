<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166b5c" />
    <title>Passport is offline</title>
    <style>
      :root { color: #18202b; background: #f6f7f9; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(420px, 100%); padding: 28px; border: 1px solid #e4e7ec; border-radius: 14px; background: white; box-shadow: 0 12px 36px rgba(24, 32, 43, .08); }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: #166b5c; color: white; font-weight: 800; font-size: 20px; }
      h1 { margin: 22px 0 8px; font-size: 22px; }
      p { color: #697386; line-height: 1.55; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>Passport is offline</h1>
      <p>Reconnect to view live bookings, availability, payments, waivers, and calendar data. Passport does not submit changes while offline.</p>
    </main>
  </body>
</html>

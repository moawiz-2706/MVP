name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/passport_test
      TEST_MIGRATED_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/passport_migrations
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Build test databases from the migration chain
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -c "CREATE DATABASE passport_test"
          psql -h localhost -U postgres -c "CREATE DATABASE passport_migrations"
          psql -h localhost -U postgres -d passport_migrations -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          for file in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d passport_migrations -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Run tests
        working-directory: backend
        run: python -m pytest -o addopts="" -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:money
      - run: npm run test:booking-notifications
      - run: npm run build
